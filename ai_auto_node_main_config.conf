# ============================================================
# AI 自动选节点 —— 主配置配套片段（本插件无法直接包含，需你手动并入主配置）
# 作用：把所有国外 AI 流量，自动走「排除中国/香港节点」后测速最快的那一个。
# 用法：把下面两段分别并入你主配置里已有的 [Remote Filter] 段和 [Proxy Group] 段。
#       然后到「配置 → 插件」启用 ai_auto_node.plugin 时，在插件项后面加 policy=AI-最优节点
#       例如：https://raw.githubusercontent.com/Thelongdarkorg/loon-plugins/main/ai_auto_node.plugin, policy=AI-最优节点, enabled=true
# ============================================================

# ---------- 1) 并入 [Remote Filter] 段：排除中国/香港节点 ----------
# NameRegex 不带订阅名 = 对全部节点生效（本地 + 所有订阅）。
# 正则含义：只要节点名里不含 中国/大陆/CN/China/回国/境内/内地/香港/HK/HKG/Hong/🇭🇰，
#           就保留为候选；即自动跳过中港节点。
境外AI节点 = NameRegex, FilterKey = "(?i)^(?!.*(中国|大陆|CN|China|回国|境内|内地|香港|HK|HKG|Hong|🇭🇰)).*$"

# ---------- 2) 并入 [Proxy Group] 段：url-test 自动选最快 ----------
# 每隔 600s 向 gstatic 的 generate_204 发请求，选延迟最低且波动 < tolerance 的节点。
# 子策略填上面那个筛选组的名字「境外AI节点」即可。
AI-最优节点 = url-test, 境外AI节点, url = http://www.gstatic.com/generate_204, interval = 600, tolerance = 100

# ---------- 3) 并入 [Plugin] 段：启用插件并绑定上面的策略组 ----------
# https://raw.githubusercontent.com/Thelongdarkorg/loon-plugins/main/ai_auto_node.plugin, policy=AI-最优节点, enabled=true
