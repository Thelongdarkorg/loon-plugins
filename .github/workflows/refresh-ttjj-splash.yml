name: refresh-ttjj-splash

# 【2026-10-06 已暂停自动运行】
# 原计划：每天北京时间 08:30 / 20:30 自动刷新天天基金开屏图黑名单。
# 暂停原因：天天基金 App 已卸载，该任务暂无实际用途（继续跑只会在接口无素材时产生噪音）。
# 恢复方式：把下面 schedule 两行的注释去掉即可，脚本与逻辑均已修复可用。
# 现在仍可在 Actions 页面手动 Run workflow 执行一次。

on:
  # schedule:
  #   - cron: "30 0 * * *"
  #   - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ttjj-splash
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch splash API and refresh blacklist
        run: python tools/refresh_ttjj_splash.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No change, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tiantianjijin_splash_ad_block.plugin
            git commit -m "chore(ttjj): auto refresh splash URL blacklist"
            git push
          fi
